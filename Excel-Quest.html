<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Excel Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: an Excel-style window (title bar, ribbon, formula bar, grid, sheet tabs) with a quest panel docked on the right */
:root{
  --xl:#217346; --xl-dark:#185c37; --xl-tint:#e6f2eb; --xl-line:#9fcbb2;
  --chrome:#f3f3f3; --ribbon:#fafafa; --line:#d6d6d6; --text:#1f1f1f; --muted:#5f6461;
  --grid-bg:#ffffff; --grid-line:#e2e2e2; --cell-text:#000000;
  --head-bg:#f2f2f2; --head-text:#454545; --head-sel:#d2ecdd; --head-sel-text:#185c37;
  --panel:#fbfcfb; --card:#ffffff; --gold:#b98900; --gold-bg:#fff4cc; --gold-line:#f0d27a;
  --done:#1d7a46; --skip:#8a6d00; --warn-bg:#fff7e0;
  --sel-tint:rgba(33,115,70,.13); --shadow:0 8px 28px rgba(20,40,30,.18);
  --ui:"Segoe UI", "Aptos", Calibri, system-ui, -apple-system, Roboto, Arial, sans-serif;
  --quest:"Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --xl:#3fa06b; --xl-dark:#2f8a59; --xl-tint:#1f3529; --xl-line:#3c6b51;
  --chrome:#1e1f1e; --ribbon:#262826; --line:#3a3d3b; --text:#ececec; --muted:#a9b0ac;
  --head-bg:#2b2d2c; --head-text:#c9cfcb; --head-sel:#24513a; --head-sel-text:#d9f3e4;
  --panel:#202321; --card:#2a2d2b; --gold:#f1c84b; --gold-bg:#3a3215; --gold-line:#6b5a1d;
  --done:#58c48a; --skip:#e3c25a; --warn-bg:#3a3215; --shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --xl:#3fa06b; --xl-dark:#2f8a59; --xl-tint:#1f3529; --xl-line:#3c6b51;
  --chrome:#1e1f1e; --ribbon:#262826; --line:#3a3d3b; --text:#ececec; --muted:#a9b0ac;
  --head-bg:#2b2d2c; --head-text:#c9cfcb; --head-sel:#24513a; --head-sel-text:#d9f3e4;
  --panel:#202321; --card:#2a2d2b; --gold:#f1c84b; --gold-bg:#3a3215; --gold-line:#6b5a1d;
  --done:#58c48a; --skip:#e3c25a; --warn-bg:#3a3215; --shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--chrome);color:var(--text);font-family:var(--ui);font-size:13px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--xl);outline-offset:1px}

/* title bar */
.titlebar{background:var(--xl);color:#fff;display:flex;align-items:center;gap:12px;padding-block:6px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));flex-wrap:wrap}
.logo{width:26px;height:26px;border-radius:4px;background:#fff;color:var(--xl);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.qat{display:flex;gap:2px}
.qat button{background:transparent;border:0;color:#fff;width:28px;height:26px;border-radius:4px;display:grid;place-items:center}
.qat button:hover{background:rgba(255,255,255,.18)}
.doc-title{font-weight:600;font-size:14px;white-space:nowrap}
.doc-title span{opacity:.8;font-weight:400}
.autosave{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.95;white-space:nowrap}
.autosave i{width:26px;height:14px;border-radius:8px;background:#fff;position:relative;display:inline-block}
.autosave i::after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--xl)}
.spacer{flex:1}
.xp-pill{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);padding:4px 10px 4px 6px;border-radius:999px;font-family:var(--quest);font-size:12px;white-space:nowrap;border:0;color:#fff}
.xp-pill b{background:#ffd34d;color:#3b2c00;border-radius:999px;padding:1px 8px;font-weight:700}

/* ribbon */
.rtabs{display:flex;gap:2px;background:var(--chrome);border-bottom:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));overflow-x:auto}
.rtabs button{background:transparent;border:0;padding:7px 12px 6px;border-bottom:3px solid transparent;color:var(--text);white-space:nowrap}
.rtabs button[aria-selected="true"]{border-bottom-color:var(--xl);color:var(--xl);font-weight:600}
.rtabs button:disabled{opacity:.45;cursor:default}
.ribbon{background:var(--ribbon);border-bottom:1px solid var(--line);display:flex;gap:0;overflow-x:auto;min-height:92px;
  padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.rgroup{display:flex;flex-direction:column;justify-content:space-between;padding:6px 10px 3px;border-right:1px solid var(--line);flex:none}
.rgroup .glabel{text-align:center;font-size:11px;color:var(--muted);padding-top:2px;white-space:nowrap}
.rrow{display:flex;gap:2px;align-items:center}
.rcol{display:flex;flex-direction:column;gap:3px}
.rb{background:transparent;border:1px solid transparent;border-radius:3px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 5px;color:var(--text)}
.rb:hover{background:var(--xl-tint);border-color:var(--xl-line)}
.rb.on{background:var(--xl-tint);border-color:var(--xl)}
.rb.big{flex-direction:column;height:66px;min-width:52px;font-size:12px;gap:3px;padding:2px 6px}
.rb.split{padding-right:0}
.rb .caret{width:14px;height:100%;display:grid;place-items:center;border-left:1px solid transparent}
.rb.split:hover .caret{border-left-color:var(--xl-line)}
.rb svg{flex:none}
.rsel{height:26px;border:1px solid var(--line);border-radius:3px;background:var(--card);padding:0 4px}
.fnbtn{font-family:Consolas, "Cascadia Mono", monospace;font-size:12px}
.swatchbar{display:block;width:16px;height:4px;margin-top:-2px}

/* formula bar */
.fbar{display:flex;align-items:center;gap:6px;background:var(--chrome);border-bottom:1px solid var(--line);padding-block:5px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#namebox{width:86px;height:26px;border:1px solid var(--line);background:var(--card);padding:0 6px;border-radius:2px}
.fx{color:var(--muted);font-style:italic;font-family:Georgia, serif;padding:0 6px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
#fbarInput{flex:1;min-width:0;height:26px;border:1px solid var(--line);background:var(--card);padding:0 8px;border-radius:2px;font-family:Consolas, "Cascadia Mono", monospace;font-size:13px}

/* main */
.work{flex:1;display:flex;min-height:0}
.gridwrap{flex:1;min-width:0;overflow:auto;background:var(--grid-bg);position:relative;outline:none}
.sheet{position:relative;display:inline-block;min-width:100%}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--grid-bg);color:var(--cell-text);font-family:var(--ui)}
.grid th{background:var(--head-bg);color:var(--head-text);font-weight:400;font-size:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);user-select:none;position:sticky;z-index:6}
.grid thead th{top:0;height:22px;text-align:center}
.grid th.rh{left:0;text-align:center;z-index:5;width:40px}
.grid th.corner{left:0;top:0;z-index:7}
.grid th.hs{background:var(--head-sel);color:var(--head-sel-text);font-weight:600;border-bottom-color:var(--xl)}
.grid th.rh.hs{border-right-color:var(--xl);border-bottom-color:var(--line)}
.grid td{position:relative;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);padding:0;vertical-align:bottom;height:24px;background-clip:padding-box;user-select:none;cursor:cell}
.grid td.nor{border-right-color:transparent}
.grid td.insel{box-shadow:inset 0 0 0 999px var(--sel-tint)}
.cv{padding:1px 4px;white-space:nowrap;overflow:hidden;line-height:1.25}
.cv.ovf{position:relative;z-index:3;overflow:hidden}
.cv.err{color:#c00000}
.bd{position:absolute;top:-1px;left:-1px;right:-1px;bottom:-1px;border:0 solid #000;pointer-events:none;z-index:2}
#selbox{position:absolute;border:2px solid var(--xl);pointer-events:none;z-index:4;box-sizing:border-box}
#fillh{position:absolute;width:8px;height:8px;background:var(--xl);border:1px solid #fff;z-index:9;cursor:crosshair;box-sizing:content-box}
#copybox,#refbox,#fillbox{position:absolute;pointer-events:none;z-index:4;box-sizing:border-box}
#copybox{border:2px dashed var(--xl);animation:ants 1s linear infinite}
#refbox{border:2px solid #1e6fd9;background:rgba(30,111,217,.08)}
#fillbox{border:1px dashed #555}
@keyframes ants{50%{border-color:transparent}}
#cellEditor{position:absolute;z-index:8;border:2px solid var(--xl);background:#fff;color:#000;padding:0 3px;outline:none;font-family:var(--ui);box-sizing:border-box;box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* status + sheet tabs */
.bottom{display:flex;align-items:stretch;background:var(--chrome);border-top:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));min-height:32px;flex-wrap:wrap}
.tabs{display:flex;gap:0;align-items:stretch}
.stab{border:0;background:transparent;padding:6px 16px;display:flex;align-items:center;gap:6px;border-bottom:3px solid transparent;color:var(--text);white-space:nowrap}
.stab[aria-selected="true"]{background:var(--grid-bg);color:var(--xl);font-weight:600;border-bottom-color:var(--xl)}
[data-theme] .stab[aria-selected="true"],.stab[aria-selected="true"]{background:var(--card)}
.stab.locked{color:var(--muted)}
.stab .cnt{font-size:11px;color:var(--muted);font-weight:400}
.status{margin-left:auto;display:flex;gap:16px;align-items:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding:4px 0}

/* quest panel */
.quest{width:350px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;font-family:var(--quest)}
.qhead{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.who{display:flex;gap:8px;align-items:center}
.who label{font-size:12px;color:var(--muted)}
#studentName{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 8px;font-family:var(--quest)}
.rank{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rank .r{font-weight:700;font-size:16px}
.rank .x{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--xl),#7bd389);border-radius:6px;transition:width .6s ease}
.nextrank{font-size:11px;color:var(--muted)}
.qbody{flex:1;overflow:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:10px}
.story{font-size:12.5px;line-height:1.5;color:var(--muted);padding:0 4px}
.story b{color:var(--text);font-weight:600;display:block;font-size:14px;margin-bottom:2px}
.tasks{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.task{border:1px solid var(--line);background:var(--card);border-radius:8px}
.task > button.th{width:100%;display:flex;gap:10px;align-items:center;background:transparent;border:0;padding:9px 10px;text-align:left;font-family:var(--quest)}
.dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.task.done .dot{background:var(--done);border-color:var(--done);color:#fff}
.task.skipped .dot{border-color:var(--skip);color:var(--skip);border-style:dashed}
.task.current{border-color:var(--xl)}
.task.current .dot{border-color:var(--xl);color:var(--xl)}
.tt{flex:1;min-width:0;font-size:13.5px;font-weight:500}
.tag{font-size:11px;color:var(--muted);white-space:nowrap}
.task.done .tag{color:var(--done)}
.task.skipped .tag{color:var(--skip)}
.tb{padding:0 12px 12px 44px;display:flex;flex-direction:column;gap:9px;font-size:13px;line-height:1.5}
.tb .bonus{font-size:12px;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:6px;padding:4px 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 10px;font-family:var(--quest);font-size:12px}
.btn:hover{border-color:var(--xl)}
.btn.primary{background:var(--xl);border-color:var(--xl);color:#fff}
.btn.ghost{background:transparent}
.help{border:1px dashed var(--xl-line);background:var(--xl-tint);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.help h4{margin:0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--xl-dark)}
:root[data-theme="dark"] .help h4{color:var(--done)}
.help p{margin:0}
.help code,.tb code{font-family:Consolas, "Cascadia Mono", monospace;background:var(--grid-bg);color:#000;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12.5px;white-space:nowrap}
.help ol{margin:0;padding-left:18px}
.lockednote{border:1px solid var(--gold-line);background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
.qfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap}

/* popovers, toast, modal */
.pop{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:8px}
.pal{display:grid;grid-template-columns:repeat(10,18px);gap:3px}
.pal button{width:18px;height:18px;border:1px solid rgba(0,0,0,.25);border-radius:2px;padding:0}
.pal button:hover{outline:2px solid var(--xl)}
.poplabel{font-size:11px;color:var(--muted);margin:6px 0 4px}
.menu{display:flex;flex-direction:column;min-width:170px}
.menu button{background:transparent;border:0;text-align:left;padding:6px 10px;border-radius:4px;display:flex;gap:8px;align-items:center}
.menu button:hover{background:var(--xl-tint)}
#toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;z-index:60;background:#1d2b23;color:#fff;padding:10px 16px;border-radius:8px;font-family:var(--quest);font-size:13.5px;max-width:min(520px, calc(100vw - 32px));box-shadow:var(--shadow);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.win{background:var(--xl)}
.modalbg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);color:var(--text);border-radius:12px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;box-shadow:var(--shadow);font-family:var(--quest)}
.modal header{background:var(--xl);color:#fff;padding:18px 22px;border-radius:12px 12px 0 0}
.modal header h2{margin:0;font-size:22px;text-wrap:balance}
.modal header p{margin:4px 0 0;opacity:.9}
.modal .mb{padding:16px 22px;display:flex;flex-direction:column;gap:12px;line-height:1.5}
.modal .mf{padding:0 22px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cert{border:3px double var(--xl);border-radius:10px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.cert .nm{font-size:26px;font-weight:700;color:var(--xl)}
.plist{display:flex;flex-direction:column;gap:12px}
.plist h3{margin:0 0 4px;font-size:14px}
.plist table{width:100%;border-collapse:collapse;font-size:12.5px}
.plist td{padding:3px 4px;border-bottom:1px solid var(--line)}
.plist td:last-child{text-align:right;white-space:nowrap;color:var(--muted)}
.ok{color:var(--done);font-weight:600}.sk{color:var(--skip);font-weight:600}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:65}

@media (max-width: 900px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .work{flex-direction:column}
  .gridwrap{height:56vh;flex:none}
  .quest{width:auto;border-left:0;border-top:1px solid var(--line)}
  .qbody{overflow:visible}
  .autosave,.doc-title span{display:none}
}
@media (prefers-reduced-motion: reduce){ #copybox{animation:none} .bar i{transition:none} #toast{transition:none} }
</style>

<div id="app">
  <header class="titlebar">
    <div class="logo" aria-hidden="true">X</div>
    <div class="qat">
      <button id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3 2 6l3 3"/><path d="M2 6h7.5a4 4 0 0 1 0 8H7"/></svg></button>
      <button id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m11 3 3 3-3 3"/><path d="M14 6H6.5a4 4 0 0 0 0 8H9"/></svg></button>
    </div>
    <div class="doc-title">Excel Quest <span>· Year 9 IT</span></div>
    <div class="autosave" title="Your work saves automatically in this browser"><i></i> Saved in this browser</div>
    <div class="spacer"></div>
    <button class="xp-pill" id="xpPill" title="See my progress"><b id="xpNum">0 XP</b><span id="rankName">Intern</span></button>
  </header>

  <nav class="rtabs" role="tablist" aria-label="Ribbon">
    <button disabled title="Not needed for this quest">File</button>
    <button role="tab" id="tabHome" aria-selected="true">Home</button>
    <button disabled title="Not needed for this quest">Insert</button>
    <button role="tab" id="tabFormulas" aria-selected="false">Formulas</button>
    <button disabled title="Not needed for this quest">Data</button>
    <button disabled title="Not needed for this quest">View</button>
  </nav>

  <div class="ribbon" id="ribbonHome">
    <div class="rgroup">
      <div class="rrow">
        <button class="rb big" data-act="paste" title="Paste (Ctrl+V)"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="13" height="17" rx="1.5"/><rect x="8.5" y="3" width="6" height="4" rx="1" fill="var(--ribbon)"/><rect x="12" y="11" width="10" height="12" rx="1" fill="var(--card)"/></svg>Paste</button>
        <div class="rcol">
          <button class="rb" data-act="cut" title="Cut (Ctrl+X)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="4" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><path d="M5.6 10.4 12 2M10.4 10.4 4 2"/></svg>Cut</button>
          <button class="rb" data-act="copy" title="Copy (Ctrl+C)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M3 11V3a1 1 0 0 1 1-1h7"/></svg>Copy</button>
        </div>
      </div>
      <div class="glabel">Clipboard</div>
    </div>
    <div class="rgroup">
      <div class="rcol">
        <div class="rrow">
          <select class="rsel" id="fontName" title="Font" aria-label="Font"><option>Aptos Narrow</option></select>
          <select class="rsel" id="fontSize" title="Font size" aria-label="Font size"></select>
        </div>
        <div class="rrow">
          <button class="rb" data-act="bold" title="Bold (Ctrl+B)"><b style="font-size:15px">B</b></button>
          <button class="rb" data-act="italic" title="Italic (Ctrl+I)"><i style="font-size:15px;font-family:Georgia,serif">I</i></button>

(() => {
'use strict';
/* ---------- constants ---------- */
const COLS = 14, ROWS = 40;
const COLW = [40, 170, 96, 96, 96, 96, 96, 96, 96, 96, 96, 96, 96, 96];

const RANKS = [[0,'Intern'],[300,'Assistant'],[700,'Analyst'],[1200,'Manager'],[1800,'Director'],[2400,'Managing Director'],[2900,'CEO']];

const PALETTE = [
  ['#FFFFFF','White'],['#000000','Black'],['#E7E6E6','Light Gray'],['#44546A','Blue-Gray'],['#4472C4','Blue, Accent 1'],['#ED7D31','Orange, Accent 2'],['#A5A5A5','Gray'],['#FFC000','Gold'],['#5B9BD5','Light Blue, Accent 5'],['#70AD47','Green, Accent 6'],
  ['#F2F2F2','White, Darker 5%'],['#7F7F7F','Black, Lighter 50%'],['#D0CECE','Light Gray, Darker 10%'],['#D6DCE4','Blue-Gray, Lighter 80%'],['#D9E1F2','Blue, Lighter 80%'],['#FCE4D6','Orange, Lighter 80%'],['#EDEDED','Gray, Lighter 80%'],['#FFF2CC','Gold, Lighter 80%'],['#DDEBF7','Light Blue, Lighter 80%'],['#E2EFDA','Green, Lighter 80%'],
  ['#C00000','Dark Red'],['#FF0000','Red'],['#FFC000','Orange'],['#FFFF00','Yellow'],['#92D050','Light Green'],['#00B050','Green'],['#00B0F0','Light Blue'],['#0070C0','Blue'],['#002060','Dark Blue'],['#7030A0','Purple'],
  ['#FFC7CE','Light Red'],['#C6EFCE','Light Green (Good)'],['#FFEB9C','Light Yellow (Neutral)']

/* ---------- address helpers ---------- */
const colName = c => String.fromCharCode(65 + c);
const colIdx = s => s.length === 1 ? s.charCodeAt(0) - 65 : (s.charCodeAt(0) - 64) * 26 + s.charCodeAt(1) - 65;
const A = (r, c) => colName(c) + (r + 1);
const K = (r, c) => r + ',' + c;
function pa(a){ const m = /^\$?([A-Z]{1,2})\$?(\d+)$/i.exec(a.trim()); if(!m) return null; return { r: parseInt(m[2],10)-1, c: colIdx(m[1].toUpperCase()) }; }
function pr(s){ const [x,y] = s.split(':'); const p = pa(x), q = y ? pa(y) : p; if(!p||!q) return null; return { r1:Math.min(p.r,q.r), c1:Math.min(p.c,q.c), r2:Math.max(p.r,q.r), c2:Math.max(p.c,q.c) }; }
function cellsIn(rng){ const g = typeof rng === 'string' ? pr(rng) : rng; const out=[]; for(let r=g.r1;r<=g.r2;r++) for(let c=g.c1;c<=g.c2;c++) out.push([r,c]); return out; }
const rangeName = s => (s.r1===s.r2&&s.c1===s.c2) ? A(s.r1,s.c1) : A(s.r1,s.c1)+':'+A(s.r2,s.c2);

/* ---------- colour helpers ---------- */
function hsl(hex){ if(!hex) return null; const n = parseInt(hex.replace('#',''),16); let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2; if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); h = mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); h*=60; } return {h,s,l}; }
const isYellow = x => { const c=hsl(x); return c && c.h>=48 && c.h<=68 && c.s>.6 && c.l>=.4 && c.l<=.85; };
const isDarkBlue = x => { const c=hsl(x); return c && c.h>=200 && c.h<=245 && c.s>.35 && c.l<=.32; };
const isGreen = x => { const c=hsl(x); return c && c.h>=75 && c.h<=165 && c.s>.25 && c.l<.97; };
const isRed = x => { const c=hsl(x); return c && (c.h<=15 || c.h>=335) && c.s>.4 && c.l<.95; };

/* ---------- templates ---------- */
function blankSheet(id){ return { id, cells:{}, merges:[], rowH:{} }; }
function buildTemplates(){
  const E = blankSheet('easy'), M = blankSheet('medium'), H = blankSheet('hard');
  const put = (sh,a,v,x={}) => { const {r,c} = pa(a); sh.cells[K(r,c)] = Object.assign({ v:String(v), lock:true }, x); };
  const row = (sh,a,arr,x) => { const {r,c} = pa(a); arr.forEach((v,i)=>{ if(v!==null) put(sh, A(r,c+i), v, x); }); };
  const ins = (sh,a,t) => put(sh,a,t,{ ins:true, b:true, fc:'#217346' });

  ins(E,'B1','Task 1: Merge B2:E2 into 1 cell. The heading should be "Welcome to my spreadsheet"');
  ins(E,'B4','Task 2: Colour the background of these cells yellow, with dark blue text');
  row(E,'B5',['Product','Price','Stock','Supplier']);
  ins(E,'B7','Task 3: Put a black border around all cells in the kit store table. Make the column headings bold');
  row(E,'B8',['Kit store','Issued','Returned','Missing']);
  row(E,'B9',['Boots',24,22,2]); row(E,'B10',['Webbing',24,24,0]); row(E,'B11',['Water bottle',30,27,3]);
  ins(E,'B13','Task 4: Copy these quarters and paste them starting in cell G14');
  row(E,'B14',['Q1','Q2','Q3','Q4']);
  ins(E,'B16','Task 5: Make these invoice column headings bold');
  row(E,'B17',['Date','Client','Invoice no.','Paid?']);
  ins(E,'B19','Task 6: Centre these values vertically and horizontally');
  row(E,'B20',['North','East','South','West']); E.rowH[19] = 40;
  ins(E,'B22','Task 7: Change the company values to font size 14 and make them italic');
  row(E,'B23',['Mission','Vision','Values','Goals']);
  ins(E,'B25','Task 8: Add a column called Total in G26 and work out each section\'s total');
  row(E,'B26',['Section','Navigation','First aid','Drill','Fieldcraft']);
  row(E,'B27',['Alpha',4,1,5,2]); row(E,'B28',['Bravo',3,2,4,2]); row(E,'B29',['Charlie',2,3,3,1]);
  ins(E,'B31','Task 9: Format these merchandise prices as currency (£)');
  row(E,'B32',[20,25,30,35]);
  ins(E,'B34','Task 10: Format these expedition distances (km) as numbers with 2 decimal places');
  row(E,'B35',[20.28392,25.12398,30.908,35.897231]);
  ins(E,'B37','Task 11: Go to the Medium worksheet (tabs at the bottom of the screen)');

  put(M,'B1','Pop-up coffee cart: Cheltenham Festival week',{ b:true, fs:14, fc:'#217346', ins:true });
  put(M,'B2','Use formulas so the spreadsheet does the maths. Every formula starts with =',{ ins:true, fc:'#595959' });
  row(M,'B4',['Item','Tue','Wed','Thu','Fri','Total','Average'],{ b:true, fill:'#E2EFDA' });
  MED.items.forEach((it,i) => row(M, 'B'+(5+i), [it.name, ...it.sales]));
  put(M,'B9','Daily total',{ b:true });
  put(M,'B11','Highest daily total'); put(M,'B12','Lowest daily total');
  row(M,'B14',['Item','Price','Cost each','Sold','Income','Profit'],{ b:true, fill:'#E2EFDA' });
  MED.items.forEach((it,i) => { const r = 'B'+(15+i); row(M, r, [it.name]); put(M,'C'+(15+i), it.price, {fmt:'currency',dp:2}); put(M,'D'+(15+i), it.cost, {fmt:'currency',dp:2}); put(M,'E'+(15+i), it.sales.reduce((a,b)=>a+b,0)); });
  put(M,'B19','Total',{ b:true });

  put(H,'B1','CCF map-reading assessment',{ b:true, fs:14, fc:'#217346', ins:true });
  put(H,'B2','Maximum score',{ b:true }); put(H,'C2',40,{ b:true, fill:'#FFF2CC', bt:1,bb:1,bl:1,br:1 });
  row(H,'B4',['Cadet','Score','Percentage','Result','Award'],{ b:true, fill:'#D9E1F2' });
  HARD.cadets.forEach((cd,i) => row(H, 'B'+(5+i), [cd.name, cd.score]));
  put(H,'B14','Number passed'); put(H,'B15','Number failed'); put(H,'B16','Average score'); put(H,'B17','Top score');
  return { easy:E, medium:M, hard:H };
}
const MED = { items: [
  { name:'Flat white', sales:[120,145,160,210], price:3.5, cost:1.1 },
  { name:'Hot chocolate', sales:[80,95,70,130], price:3, cost:0.9 },

MED.items.forEach(it => { it.total = it.sales.reduce((a,b)=>a+b,0); it.avg = it.total/4; it.income = it.total*it.price; it.profit = (it.price-it.cost)*it.total; });

const HARD = { max:40, pass:20, cadets: [['Amira',34],['Ben',22],['Chen',18],['Dara',39],['Eli',27],['Fatima',12],['George',31],['Hana',25]].map(([name,score])=>({name,score})) };

/* ---------- quests ---------- */
const nums = (S, rng, arr) => cellsIn(rng).every(([r,c],i) => S.numRC(r,c,arr[i]));
const forms = (S, rng, fn) => cellsIn(rng).every(([r,c]) => S.isF(A(r,c)) && (!fn || S.uses(A(r,c), fn)));
const QUESTS = {
 easy: { title:'Easy', sub:'Make it look professional', story:'Every business, club and department needs a clear spreadsheet. Use the Home tab to format this one.', unlockAt:0,
  tasks: [
   { id:'e1', title:'Merge a heading', go:'B2:E2',

   { id:'e2', title:'Fill and font colour', go:'B5:E5',
     text:'Colour the background of <b>B5:E5</b> yellow and make the text dark blue.',
     help:['You need two buttons: the paint bucket (Fill Color) and the letter A (Font Color).',

   { id:'e3', title:'Borders and bold', go:'B8:E11',

     help:['Borders are in the Font group. The button looks like a square split into four.',

       'Select <code>B14:E14</code> → Ctrl + C → click <code>G14</code> → Ctrl + V. G14:J14 should show Q1, Q2, Q3, Q4.'],

let state = loadState();
function freshState(){ return { v:1, name:'', active:'easy', sheets: buildTemplates(), done:{}, bonus:{}, help:{}, xp:0, visited:{ easy:true }, celebrated:{}, sel:{} }; }
function loadState(){

const ERR = e => ({ err:e });

let cache = new Map();

function cellValue(sh, r, c, stack){

  const ck = sh.id+'!'+K(r,c);
  if(cache.has(ck)) return cache.get(ck);

function tokenize(s){

/* ---------- checks, XP, quest panel ---------- */
function api(sh){
  const valRC = (r,c) => cellValue(sh, r, c, new Set());
  const f = a => { const p = pa(a); return String((sh.cells[K(p.r,p.c)]||{}).v || ''); };
  const S = {
    sh, valRC, f,
    val: a => { const p = pa(a); return valRC(p.r,p.c); },
    numRC: (r,c,x) => { const v = valRC(r,c); return typeof v==='number' && Math.abs(v-x) < 1e-6; },
    num: (a,x) => { const p = pa(a); return S.numRC(p.r,p.c,x); },
    isF: a => f(a).startsWith('='),
    uses: (a,fn) => f(a).toUpperCase().replace(/\s/g,'').includes(fn+'('),
    all: (rng, pred) => cellsIn(rng).every(([r,c]) => pred(sh.cells[K(r,c)]||{})),
    allEdges: rng => { const C = (r,c) => sh.cells[K(r,c)]||{}; return cellsIn(rng).every(([r,c]) => (C(r,c).bt || (r>0 && C(r-1,c).bb)) && (C(r,c).bb || C(r+1,c).bt) && (C(r,c).bl || (c>0 && C(r,c-1).br)) && (C(r,c).br || C(r,c+1).bl)); }
  };
  return S;
}
function statusOf(id){ return state.done[id] ? 'done' : (state.help[id] && state.help[id].skipped) ? 'skipped' : 'todo'; }

function unlocked(sheet){ const q = QUESTS[sheet]; return !q.unlockFrom || finishedCount(q.unlockFrom) >= q.unlockAt; }
function taskXP(t){ const lv = (state.help[t.id] || {}).level || 0; return XP_TASK - (lv ? HELP_COST[lv-1] : 0); }
function runChecks(){
  cache = new Map();
  const wins = [];
  SHEET_IDS.forEach(id => {
    const S = api(state.sheets[id]);
    QUESTS[id].tasks.forEach((t, idx) => {
      let ok = false; try { ok = !!t.check(S); } catch(e){ ok = false; }
      if(ok && !state.done[t.id]){ state.done[t.id] = true; const gain = taskXP(t); state.xp += gain; wins.push({ t, idx, gain, sheet:id }); if(state.help[t.id]) state.help[t.id].skipped = false; }
      if(t.bonusCheck && state.done[t.id] && !state.bonus[t.id]){ let b = false; try { b = !!t.bonusCheck(S); } catch(e){} if(b){ state.bonus[t.id] = true; state.xp += XP_BONUS; wins.push({ t, idx, gain:XP_BONUS, bonus:true, sheet:id }); } }
    });
  });
  if(wins.length){
    const w = wins[wins.length-1];
    const msg = wins.map(x => x.bonus ? `Bonus! +${x.gain} XP` : `Level ${x.idx+1} complete: ${x.t.title} · +${x.gain} XP`).join('  ·  ');
    toast(msg, true); confetti(wins.some(x=>!x.bonus) ? 160 : 90);
    const sheetDone = SHEET_IDS.find(id => !state.celebrated[id] && QUESTS[id].tasks.every(t => state.done[t.id]));
    if(sheetDone){ state.celebrated[sheetDone] = true; setTimeout(() => { confetti(320); sheetModal(sheetDone); }, 700); }
    save();
  }
  return wins;
}
function rankFor(xp){ let i = 0; RANKS.forEach((r,j) => { if(xp >= r[0]) i = j; }); return i; }
const openTask = {};
function renderPanel(){
  const xp = state.xp, ri = rankFor(xp), next = RANKS[ri+1];
  document.getElementById('xpNum').textContent = xp + ' XP';
  document.getElementById('rankName').textContent = RANKS[ri][1];
  document.getElementById('rankBig').textContent = RANKS[ri][1];
  document.getElementById('xpBig').textContent = xp + ' XP';
  document.getElementById('xpBar').style.width = (next ? ((xp - RANKS[ri][0]) / (next[0] - RANKS[ri][0]) * 100) : 100) + '%';
  document.getElementById('nextRank').textContent = next ? `${next[0]-xp} XP to ${next[1]}` : 'Top rank reached';
  const q = QUESTS[state.active]; const body = document.getElementById('qbody');
  const doneN = q.tasks.filter(t => state.done[t.id]).length;
  let h = `<div class="story"><b>${q.title} · ${q.sub} <span style="font-weight:400;color:var(--muted)">(${doneN}/${q.tasks.length})</span></b>${q.story}</div><ol class="tasks">`;
  const firstTodo = q.tasks.find(t => statusOf(t.id)==='todo');
  q.tasks.forEach((t, i) => {
    const st = statusOf(t.id); const isCur = firstTodo && firstTodo.id===t.id;
    const open = openTask[state.active] ? openTask[state.active]===t.id : isCur;
    const hl = state.help[t.id] || {};
    const tag = st==='done' ? (state.bonus[t.id] ? `+${taskXP(t)+XP_BONUS} XP ★` : `+${taskXP(t)} XP`) : st==='skipped' ? 'Skipped' : hl.level ? `Help ${hl.level}/3` : '100 XP';
    h += `<li class="task ${st} ${isCur?'current':''}"><button class="th" data-open="${t.id}" aria-expanded="${open}"><span class="dot">${st==='done'?'✓':i+1}</span><span class="tt">${t.title}</span><span class="tag">${tag}</span></button>`;
    if(open){
      h += `<div class="tb"><div>${t.text}</div>`;
      if(t.bonus) h += `<div class="bonus">★ Bonus +${XP_BONUS} XP: ${t.bonus}${state.bonus[t.id]?' <b>Earned</b>':''}</div>`;
      const lvl = hl.level || 0;
      if(lvl>0){ h += '<div class="help">'; const names = ['Nudge','Step by step','The answer']; for(let k=0;k<lvl;k++) h += `<h4>${names[k]}</h4><div>${t.help[k]}</div>`; h += '</div>'; }
      h += '<div class="acts">';
      if(t.go) h += `<button class="btn" data-go="${t.go}">Go to ${t.go}</button>`;
      if(st!=='done' && lvl<3) h += `<button class="btn" data-help="${t.id}">${['I\'m stuck: give me a nudge','Show me step by step','Show me the answer'][lvl]}</button>`;
      if(st==='todo' && lvl>=1 && !t.nav) h += `<button class="btn ghost" data-skip="${t.id}">Skip for now</button>`;
      h += '</div>';
      if(st!=='done' && lvl>0) h += `<div style="font-size:11.5px;color:var(--muted)">Using help lowers the XP for this task, and it is still worth finishing. Help used: ${['','nudge','steps','answer'][lvl]}.</div>`;
      if(st==='skipped') h += `<div style="font-size:11.5px;color:var(--skip)">Skipped. Come back to it any time: it still counts when you finish it.</div>`;
      h += '</div>';
    }
    h += '</li>';
  });
  h += '</ol>';
  const nextSheet = SHEET_IDS[SHEET_IDS.indexOf(state.active)+1];
  if(nextSheet && !unlocked(nextSheet)){ const nq = QUESTS[nextSheet]; h += `<div class="lockednote"><b>${nq.title}</b> opens when you have finished or skipped ${nq.unlockAt} ${q.title} tasks. You are on ${finishedCount(state.active)}.</div>`; }
  body.innerHTML = h;
  body.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.open; openTask[state.active] = (openTask[state.active]===id) ? '__none' : id; renderPanel(); }));
  body.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { const g = pr(b.dataset.go); if(editing) commitEdit(); sel = expandSel({ ar:g.r1, ac:g.c1, ...g }); updateSelUI(); scrollToCell(g.r2,g.c2); scrollToCell(g.r1,g.c1); gridwrap.focus({preventScroll:true}); }));
  body.querySelectorAll('[data-help]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.help; const hl = state.help[id] = state.help[id] || { level:0 }; hl.level = Math.min(3, (hl.level||0)+1); openTask[state.active] = id; save(); renderPanel(); }));
  body.querySelectorAll('[data-skip]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.skip; state.help[id] = Object.assign(state.help[id]||{level:1}, { skipped:true }); openTask[state.active] = null; save(); renderTabs(); renderPanel(); toast('Skipped for now. Your teacher can see which tasks you skipped.'); }));
  renderTabs();
}
function renderTabs(){
  const host = document.getElementById('sheetTabs');
  host.innerHTML = SHEET_IDS.map(id => { const q = QUESTS[id]; const lk = !unlocked(id); const d = q.tasks.filter(t=>state.done[t.id]).length;
    return `<button class="stab ${lk?'locked':''}" role="tab" aria-selected="${state.active===id}" data-sheet="${id}">${lk?'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-label="Locked"><rect x="2" y="5.5" width="8" height="5.5" rx="1"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5"/></svg>':''}${q.title}<span class="cnt">${d}/${q.tasks.length}</span></button>`; }).join('');
  host.querySelectorAll('[data-sheet]').forEach(b => b.addEventListener('click', () => switchSheet(b.dataset.sheet)));
}
function switchSheet(id){
  if(id===state.active) return;
  if(!unlocked(id)){ const q = QUESTS[id]; toast(`${q.title} opens when you have finished or skipped ${q.unlockAt} ${QUESTS[q.unlockFrom].title} tasks.`); return; }
  if(editing) commitEdit();
  state.active = id; state.visited[id] = true;
  sel = state.sel[id] || { ar:1, ac:1, r1:1, c1:1, r2:1, c2:1 };
  gridwrap.scrollTop = 0; gridwrap.scrollLeft = 0;
  render(); runChecks(); renderPanel(); save();
}
function afterChange(){ render(); runChecks(); renderPanel(); save(); }

/* ---------- toast, modal, confetti ---------- */
let toastT = null;
function toast(msg, win){ const el = document.getElementById('toast'); el.textContent = msg; el.className = 'show' + (win ? ' win' : ''); clearTimeout(toastT); toastT = setTimeout(() => el.className = win ? 'win' : '', win ? 3200 : 2600); }
function modal(html, onMount){ document.getElementById('modalHost').innerHTML = `<div class="modalbg" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`; const bg = document.querySelector('.modalbg'); bg.addEventListener('mousedown', e => { if(e.target===bg) closeModal(); }); bg.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal)); if(onMount) onMount(bg); const f = bg.querySelector('button'); f && f.focus(); }
function closeModal(){ document.getElementById('modalHost').innerHTML = ''; gridwrap.focus({preventScroll:true}); }
function sheetModal(id){
  const idx = SHEET_IDS.indexOf(id), next = SHEET_IDS[idx+1];
  if(SHEET_IDS.every(s => QUESTS[s].tasks.every(t => state.done[t.id]))) return certificate();
  modal(`<header><h2>${QUESTS[id].title} sheet complete</h2><p>Every task finished. ${RANKS[rankFor(state.xp)][1]} · ${state.xp} XP</p></header>
    <div class="mb"><p>${id==='easy' ? 'You can format a spreadsheet so it looks professional. Next: formulas that do the maths for you.' : 'You can use SUM, AVERAGE, MIN, MAX and formulas that multiply. Next: decisions with IF and references that stay still.'}</p></div>
    <div class="mf">${next && state.active!==next ? `<button class="btn" data-close>Stay here</button><button class="btn primary" id="goNext">Go to ${QUESTS[next].title}</button>` : '<button class="btn primary" data-close>Keep going</button>'}</div>`,
    bg => { const g = bg.querySelector('#goNext'); g && g.addEventListener('click', () => { closeModal(); switchSheet(next); }); });
}
function today(){ return new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }); }
function certificate(){
  modal(`<header><h2>Quest complete</h2><p>All three worksheets finished</p></header>
    <div class="mb"><div class="cert"><div>This certifies that</div><div class="nm">${esc(state.name || 'Excel Quest student')}</div><div>completed Excel Quest (Easy, Medium and Hard)</div><div><b>${state.xp} XP</b> · Rank: <b>${RANKS[rankFor(state.xp)][1]}</b></div><div style="color:var(--muted);font-size:12px">${today()} · Year 9 IT</div></div>
    <p style="margin:0;font-size:13px;color:var(--muted)">Show this screen to your teacher. ${state.name ? '' : 'Type your name in the box at the top of the quest panel first.'}</p></div>
    <div class="mf"><button class="btn primary" data-close>Close</button></div>`);
}
function progressModal(){
  const rows = SHEET_IDS.map(id => { const q = QUESTS[id];
    return `<div><h3>${q.title} · ${q.sub}</h3><table>${q.tasks.map((t,i) => { const st = statusOf(t.id); const hl = state.help[t.id]||{}; const help = hl.level ? ` · help: ${['','nudge','steps','answer'][hl.level]}` : '';
      return `<tr><td>${i+1}. ${t.title}</td><td>${st==='done'?'<span class="ok">Done</span>':st==='skipped'?'<span class="sk">Skipped</span>':'Not yet'}${state.bonus[t.id]?' ★':''}${help}</td></tr>`; }).join('')}</table></div>`; }).join('');
  const doneAll = SHEET_IDS.reduce((a,id)=>a+QUESTS[id].tasks.filter(t=>state.done[t.id]).length,0), total = SHEET_IDS.reduce((a,id)=>a+QUESTS[id].tasks.length,0);
  modal(`<header><h2>${esc(state.name || 'My progress')}</h2><p>${doneAll} of ${total} tasks · ${state.xp} XP · ${RANKS[rankFor(state.xp)][1]} · ${today()}</p></header>
    <div class="mb"><div class="plist">${rows}</div></div>
    <div class="mf"><button class="btn ghost" id="resetBtn">Start again</button><button class="btn primary" data-close>Close</button></div>`,
    bg => { const rb = bg.querySelector('#resetBtn'); let armed = false; rb.addEventListener('click', () => { if(!armed){ armed = true; rb.textContent = 'Click again to delete all progress'; rb.style.borderColor = '#c00000'; rb.style.color = '#c00000'; return; } const nm = state.name; state = freshState(); state.name = nm; Object.keys(undo).forEach(k=>delete undo[k]); clip = null; sel = { ar:1, ac:1, r1:1, c1:1, r2:1, c2:1 }; closeModal(); render(); renderPanel(); save(); toast('Progress reset'); }); });
}
document.getElementById('progressBtn').addEventListener('click', progressModal);
document.getElementById('xpPill').addEventListener('click', progressModal);
document.getElementById('keysBtn').addEventListener('click', () => modal(`<header><h2>Keyboard shortcuts</h2><p>The same shortcuts work in Microsoft Excel</p></header><div class="mb"><div class="plist"><table>
  ${[['Ctrl + C / X / V','Copy, cut, paste'],['Ctrl + Z / Y','Undo, redo'],['Ctrl + B / I / U','Bold, italic, underline'],['Enter / Tab','Confirm and move down / right'],['Shift + arrow','Select more cells'],['F2','Edit the cell you are on'],['Delete','Clear the selected cells'],['Esc','Cancel typing'],['Ctrl + `','Show formulas']].map(([k,v])=>`<tr><td><b>${k}</b></td><td>${v}</td></tr>`).join('')}
  </table><p style="margin:0">Tip: while typing a formula, click a cell to add it to the formula. Drag to add a range.</p></div></div><div class="mf"><button class="btn primary" data-close>Close</button></div>`));
const nameIn = document.getElementById('studentName');
nameIn.value = state.name || '';
nameIn.addEventListener('input', () => { state.name = nameIn.value; save(); });
nameIn.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); gridwrap.focus({preventScroll:true}); } });

const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const CCOL = ['#217346','#33c481','#ffd34d','#f2b705','#4472c4','#ed7d31','#ffffff','#e84a5f','#7bd389'];
let parts = [], raf = null;
function confetti(n){
  n = reduced ? Math.min(25, n) : n;
  cv.width = window.innerWidth * devicePixelRatio; cv.height = window.innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const W = window.innerWidth;
  for(let i=0;i<n;i++) parts.push({ x:Math.random()*W, y:-20-Math.random()*window.innerHeight*0.6, vx:(Math.random()-.5)*2.4, vy:1.6+Math.random()*2.6, rot:Math.random()*6.28, vr:(Math.random()-.5)*.25, w:6+Math.random()*6, h:9+Math.random()*8, col:CCOL[i%CCOL.length], flip:Math.random()*6.28, round:Math.random()<.25 });
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  const H = window.innerHeight; cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.y < H + 30);
  for(const p of parts){
    p.vy = Math.min(p.vy + 0.03, 5); p.x += p.vx + Math.sin(p.y/40)*0.6; p.y += p.vy; p.rot += p.vr; p.flip += 0.12;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.col;
    if(p.round){ cx.beginPath(); cx.arc(0,0,p.w/2,0,6.28); cx.fill(); }
    else { const sx = Math.cos(p.flip); cx.fillRect(-p.w/2*sx, -p.h/2, p.w*sx || 1, p.h); }
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

/* ---------- boot ---------- */
sel = state.sel[state.active] || sel;
if(!unlocked(state.active)) state.active = 'easy';
render(); runChecks(); renderPanel();
gridwrap.focus({ preventScroll:true });
window.__excelQuest = { state: () => state, setSel:(a)=>{ const g = pr(a); sel = expandSel({ ar:g.r1, ac:g.c1, ...g }); updateSelUI(); }, act, setRaw:(a,t)=>{ const p = pa(a); pushUndo(); setRaw(p.r,p.c,t); afterChange(); }, mergeCenter, applyBorders, copySel, pasteClip, applyFill:(src,r,c,d)=>applyFill(pr(src),r,c,d), switchSheet, formatSel, val:(a)=>{ const p=pa(a); cache=new Map(); return cellValue(cur(),p.r,p.c,new Set()); } };
})();
</script>
