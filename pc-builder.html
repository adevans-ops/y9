<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Build Your PC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a workbench. The PC being built stays in view on the left; the task for each stage sits on the right. Stacks to one column on phones. */
:root {
  --bg: #F2F7F6;
  --surface: #FFFFFF;
  --surface-2: #E6F3F0;
  --ink: #13292C;
  --muted: #4C6A6D;
  --head: #013438;
  --teal: #027785;
  --teal-soft: #CDEDE8;
  --accent: #F3A712;
  --accent-ink: #1B1A12;
  --accent-soft: #FFF3D9;
  --line: #CBE0DC;
  --good: #0B7A54;
  --good-soft: #DDF3EA;
  --bad: #B33A0E;
  --bad-soft: #FCE6DC;
  --case: #FBFDFC;
  --case-line: #5C7A7D;
  --part: #9CC9C3;
  --part-line: #4F7376;
  --mobo: #D6EBE7;
  --mobo-line: #9CC9C3;
  --screen: #0B1F22;
  --screen-ink: #7CF0C8;
  --display: 'Caladea', Cambria, Georgia, serif;
  --body: 'Carlito', Calibri, 'Segoe UI', Arial, sans-serif;
  --mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1D20; --surface: #0F282C; --surface-2: #15363B; --ink: #E2F1EE; --muted: #9BBAB6; --head: #E8F6F3;
    --teal: #4CC7B8; --teal-soft: #1B4A4F; --accent: #F3A712; --accent-ink: #1B1A12; --accent-soft: #3A2F14;
    --line: #24494E; --good: #45D597; --good-soft: #143A2D; --bad: #FF8D5E; --bad-soft: #3E2117;
    --case: #13302F; --case-line: #7FA8A6; --part: #3E7470; --part-line: #8FC3BD; --mobo: #1C3F42; --mobo-line: #3E6E70;
    --screen: #04110F; --screen-ink: #7CF0C8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1D20; --surface: #0F282C; --surface-2: #15363B; --ink: #E2F1EE; --muted: #9BBAB6; --head: #E8F6F3;
  --teal: #4CC7B8; --teal-soft: #1B4A4F; --accent: #F3A712; --accent-ink: #1B1A12; --accent-soft: #3A2F14;
  --line: #24494E; --good: #45D597; --good-soft: #143A2D; --bad: #FF8D5E; --bad-soft: #3E2117;
  --case: #13302F; --case-line: #7FA8A6; --part: #3E7470; --part-line: #8FC3BD; --mobo: #1C3F42; --mobo-line: #3E6E70;
  --screen: #04110F; --screen-ink: #7CF0C8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); color: var(--head); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(30px, 4vw, 42px); }
h2 { font-size: clamp(24px, 3vw, 30px); }
h3 { font-size: 21px; }
p { margin: 0; }
.eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal); }
.lede { color: var(--muted); max-width: 62ch; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
header.top .titles { display: flex; flex-direction: column; gap: 4px; }
.stepper { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.stepper button { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px 6px 6px; font-size: 16px; color: var(--muted); }
.stepper button .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; color: var(--head); font-variant-numeric: tabular-nums; }
.stepper button[aria-current="step"] { border-color: var(--accent); color: var(--ink); font-weight: 700; }
.stepper button[aria-current="step"] .n { background: var(--accent); color: var(--accent-ink); }
.stepper button.done .n { background: var(--teal); color: var(--surface); }
.stepper button:disabled { opacity: 0.5; cursor: not-allowed; }
.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.bench { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 900px) { .bench { position: static; } }
.bench svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.spec { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; font-size: 15px; border-top: 1px solid var(--line); padding-top: 10px; }
.spec dt { font-weight: 700; color: var(--head); }
.spec dd { margin: 0; color: var(--muted); }
.spec .pr { font-family: var(--mono); font-size: 14px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.tint { background: var(--surface-2); border-color: transparent; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 700; }
.btn:hover { border-color: var(--teal); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--surface); }
.btn.big { font-size: 20px; padding: 12px 22px; }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkish { background: none; border: none; padding: 0; color: var(--teal); text-decoration: underline; font-weight: 700; }
/* Stage 1 */
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 26px; height: 8px; border-radius: 4px; background: var(--line); }
.dots i.on { background: var(--teal); }
.dots i.cur { background: var(--accent); }
.sentence { font-size: 22px; line-height: 2; }
.blank { font: inherit; font-size: 20px; width: 9.5em; max-width: 100%; padding: 2px 8px; border: none; border-bottom: 3px solid var(--teal); background: var(--surface-2); color: var(--ink); border-radius: 6px 6px 0 0; }
.blank.wrong { border-bottom-color: var(--bad); background: var(--bad-soft); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px dashed var(--teal); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-weight: 700; color: var(--head); }
.chip.used { border-style: solid; border-color: var(--line); color: var(--muted); text-decoration: line-through; }
.fb { border-radius: 12px; padding: 12px 16px; font-size: 17px; }
.fb:empty { display: none; }
.fb.ok { background: var(--good-soft); color: var(--ink); border-left: 5px solid var(--good); }
.fb.no { background: var(--bad-soft); color: var(--ink); border-left: 5px solid var(--bad); }
.fb.tip { background: var(--accent-soft); color: var(--ink); border-left: 5px solid var(--accent); }
.power { width: 112px; height: 112px; border-radius: 50%; border: 6px solid var(--accent); background: var(--surface); display: grid; place-items: center; align-self: center; }
.power svg { width: 52px; height: 52px; }
.power:hover { background: var(--accent-soft); }
/* Stage 2 */
.purposes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.purpose { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.purpose:hover { border-color: var(--teal); }
.purpose .budget { font-family: var(--mono); font-size: 15px; color: var(--teal); font-weight: 700; }
.purpose strong { font-family: var(--display); font-size: 21px; color: var(--head); }
.purpose span.d { color: var(--muted); font-size: 16px; }
.needs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.needs li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.mark.y { background: var(--good); color: var(--surface); }
.mark.n { background: var(--bad-soft); color: var(--bad); border: 2px solid var(--bad); }
.needs .t { font-weight: 700; }
.needs .w { display: block; color: var(--muted); font-size: 16px; }
fieldset.part { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; background: var(--surface); }
fieldset.part.prio { border: 2px solid var(--accent); }
fieldset.part legend { padding: 0 6px; font-weight: 700; color: var(--head); font-size: 19px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.role { font-weight: 400; color: var(--muted); font-size: 16px; }
.badge { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 10px; }
.badge.cool { background: var(--teal-soft); color: var(--head); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 128px), 1fr)); gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt:hover { border-color: var(--teal); }
.opt[aria-pressed="true"] { border-color: var(--teal); background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--teal); }
.opt b { color: var(--head); }
.opt small { color: var(--muted); font-size: 14px; line-height: 1.3; }
.opt .pr { font-family: var(--mono); font-size: 14px; color: var(--ink); }
.why { font-size: 16px; color: var(--muted); }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 700; }
.meter .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 6px; transition: width 0.3s; }
.bar.over i { background: var(--bad); }
.status { font-size: 15px; }
.status.ok { color: var(--good); font-weight: 700; }
.status.no { color: var(--bad); font-weight: 700; }
.stars { font-size: 26px; letter-spacing: 2px; color: var(--accent); }
.stars .off { color: var(--line); }
/* Stage 3 */
.periphs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.pc { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pc.rec { border-color: var(--accent); }
.pc.chosen { background: var(--surface-2); border-color: var(--teal); }
.pc .top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.pc .nm { font-weight: 700; color: var(--head); }
.pc .pr { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
.pc .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; }
.tag.rec { background: var(--accent); color: var(--accent-ink); }
.tag.in { background: var(--teal); color: var(--surface); }
.tag.out { background: var(--head); color: var(--surface); }
.tag.both { background: var(--accent-soft); color: var(--ink); border: 1px solid var(--accent); }
.classify { display: flex; flex-direction: column; gap: 6px; }
.classify .row button { flex: 1; }
.desk { display: flex; flex-wrap: wrap; gap: 8px; }
.desk:empty::before { content: "Nothing on your desk yet. Pick a screen and something to type or click with."; color: var(--muted); font-size: 16px; }
.desk span { display: inline-flex; gap: 6px; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 15px; }
/* Boot */
.monitor { background: var(--head); border-radius: 18px; padding: 14px; }
.post { background: var(--screen); color: var(--screen-ink); font-family: var(--mono); font-size: 15px; line-height: 1.6; border-radius: 8px; padding: 16px; min-height: 280px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.post .hi { color: #F3C55A; }
.summary dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.summary dt { font-weight: 700; color: var(--head); }
.summary dd { margin: 0; }
ol.qs { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.small { font-size: 15px; color: var(--muted); }
/* Rig */
.r-case { fill: var(--case); stroke: var(--case-line); stroke-width: 4; }
.r-mobo { fill: var(--mobo); stroke: var(--mobo-line); stroke-width: 3; }
.r-trace { fill: none; stroke: var(--mobo-line); stroke-width: 3; }
.r-part { fill: var(--part); stroke: var(--part-line); stroke-width: 3; }
.r-det { fill: none; stroke: var(--part-line); stroke-width: 3; }
.r-out { fill: none; stroke: var(--part-line); stroke-width: 4; stroke-dasharray: 14 8; }
.r-tube { fill: none; stroke: var(--part-line); stroke-width: 8; stroke-linecap: round; }
.new .r-part, .new .r-mobo { fill: var(--accent); stroke: var(--head); stroke-width: 4; }
.new .r-det, .new .r-trace { stroke: var(--head); }
.new .r-out { stroke: var(--accent); stroke-width: 6; }
.new .r-tube { stroke: var(--accent); }
.pg { animation: fitin 0.45s ease-out both; transform-box: fill-box; transform-origin: center; }
.pg.off, #rig .off { display: none; }
@keyframes fitin { from { opacity: 0; transform: translateY(-24px) scale(0.96); } to { opacity: 1; transform: none; } }
.r-led { fill: var(--line); }
.standby .r-led { fill: #F3A712; }
.on .r-led { fill: #22D17B; }
.r-glow { fill: var(--line); }
.on .r-glow { fill: url(#rgb); animation: pulse 2.4s ease-in-out infinite; }
.fan { transform-box: fill-box; transform-origin: center; }
.on .fan { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) {
  .pg, .on .fan, .on .r-glow { animation: none; }
  .bar i { transition: none; }
}
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.site { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.site.rec { border-color: var(--accent); }
.site p { font-size: 16px; color: var(--muted); }
.site .look { color: var(--ink); }
.site .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.site a.btn { align-self: flex-start; margin-top: auto; text-decoration: none; }
.rcform { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 15px; font-weight: 700; color: var(--head); }
.fld input { font: inherit; font-weight: 400; font-size: 17px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.tablewrap { overflow-x: auto; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 16px; }
table.cmp th, table.cmp td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.cmp thead th { color: var(--head); background: var(--surface-2); }
table.cmp tbody th { color: var(--head); width: 18%; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; box-shadow: 0 6px 18px rgba(1, 52, 56, 0.08); }
.topbar .prog { flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.topbar .plab { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 700; color: var(--head); }
.topbar .plab .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.topbar .pbar { height: 14px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.topbar .pbar i { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--teal), var(--accent)); transition: width 0.5s ease; }
.price { display: flex; align-items: baseline; gap: 10px; position: relative; }
.price .pl { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.price .pv { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--head); font-variant-numeric: tabular-nums; }
.price .delta { position: absolute; right: 0; top: -6px; font-family: var(--mono); font-size: 15px; font-weight: 700; padding: 1px 8px; border-radius: 999px; animation: rise 1.6s ease-out forwards; pointer-events: none; }
.price .delta.up { background: var(--accent); color: var(--accent-ink); }
.price .delta.down { background: var(--good-soft); color: var(--good); }
@keyframes rise { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: translateY(-14px); } 75% { opacity: 1; transform: translateY(-18px); } 100% { opacity: 0; transform: translateY(-26px); } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
@media (prefers-reduced-motion: reduce) { .price .delta { animation: none; opacity: 0; } .topbar .pbar i { transition: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<div class="wrap">

          </linearGradient>
        </defs>
        <rect class="r-case" x="10" y="10" width="700" height="580" rx="24"/>

        <g id="g-motherboard" class="pg off">
          <rect class="r-mobo" x="50" y="50" width="460" height="400" rx="10"/>
          <path class="r-trace" d="M70 80 H110 M70 240 H120 M440 290 V340 M470 290 V330 M70 345 H300"/>
        </g>
        <g id="g-psu" class="pg off">

  function summaryText() {
    var pu = purpose(), out = ['My PC build for: ' + pu.name + ' (budget ' + money(pu.budget) + ')'];
    TIER_KEYS.forEach(function (k) { out.push(T[k].label + ': ' + opt(k).n + ' (' + money(opt(k).p) + ')'); });
    out.push('Peripherals: ' + S.periph.map(function (c) { var d = pById(c.id); return d.n + ' [' + TYPE_WORD[d.t] + ']'; }).join(', '));
    out.push('Total: ' + money(towerCost() + periphCost()));
    out.push('Rating: ' + towerStars() + ' out of 5 stars');
    return out.join('\n');
  }

  // ---------- top bar: progress and price ----------
  function currentPrice() {
    if (S.stage === 1 && !S.s1.powered) { var t = 0; for (var i = 0; i < S.s1.i; i++) t += S1_PRICE[ORDER[i]]; return t; }
    return towerCost() + periphCost();
  }
  function progressPct() {
    var p = (S.s1.i / 8) * 30 + (S.s1.powered ? 5 : 0) + (S.purpose ? 10 : 0) + (S.s2done ? 20 : 0) +
      (S.finished ? 25 : Math.min(20, S.periph.length * 5)) + (S.finished ? 5 : 0) + (S.stage === 5 || ui.sawReal ? 5 : 0);
    return Math.round(Math.min(100, p));
  }
  var lastPrice = null;
  function renderTop() {
    var pct = progressPct();
    document.getElementById('pstage').textContent = 'Stage ' + S.stage + ' of 5 · ' + STAGE_NAMES[S.stage - 1];
    document.getElementById('ppct').textContent = pct + '% complete';
    var bar = document.getElementById('pbar'); bar.setAttribute('aria-valuenow', pct); bar.firstElementChild.style.width = pct + '%';
    var price = currentPrice();
    document.getElementById('pv').textContent = money(price);
    if (lastPrice !== null && price !== lastPrice) {
      var box = document.querySelector('.price'), old = box.querySelector('.delta'); if (old) old.remove();
      var d = document.createElement('span'); var diff = price - lastPrice;
      d.className = 'delta ' + (diff > 0 ? 'up' : 'down'); d.setAttribute('aria-hidden', 'true');
      d.textContent = (diff > 0 ? '+' : '−') + money(Math.abs(diff));
      box.appendChild(d); setTimeout(function () { d.remove(); }, 1700);
    }
    lastPrice = price;
  }

  // ---------- confetti ----------
  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var old = document.getElementById('confetti'); if (old) old.remove();
    var c = document.createElement('canvas'); c.id = 'confetti'; c.setAttribute('aria-hidden', 'true'); document.body.appendChild(c);
    var ctx = c.getContext('2d'); if (!ctx) return;
    var dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.scale(dpr, dpr);
    var cols = ['#F3A712', '#02C39A', '#028090', '#5BA8F5', '#E4572E', '#FFD166'];
    var bits = [];
    for (var i = 0; i < 160; i++) bits.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, w: 6 + Math.random() * 6, h: 10 + Math.random() * 8,
      vy: 2.5 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, r: Math.random() * 6.28, vr: -0.2 + Math.random() * 0.4, c: cols[i % cols.length], sway: Math.random() * 6.28 });
    var start = performance.now();
    (function frame(now) {
      var t = now - start; ctx.clearRect(0, 0, W, H);
      var alive = false;
      bits.forEach(function (b) {
        b.y += b.vy; b.sway += 0.05; b.x += b.vx + Math.sin(b.sway) * 0.8; b.r += b.vr;
        if (b.y < H + 30) alive = true;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.globalAlpha = t > 3200 ? Math.max(0, 1 - (t - 3200) / 600) : 1;
        ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
      });
      if (alive && t < 3800) requestAnimationFrame(frame); else c.remove();
    })(start);
  }

  // ---------- render + events ----------
  function render() {
    renderStepper(); renderRig(); renderSpec(); renderTop();
    if (S.stage === 5) renderS5(); // marks the stage as seen before the top bar is drawn
    renderTop();
    panel.innerHTML = S.stage === 1 ? renderS1() : S.stage === 2 ? renderS2() : S.stage === 3 ? renderS3() : S.stage === 4 ? renderS4() : renderS5();
    if (S.stage === 4) playPost();
  }

  panel.addEventListener('focusin', function (e) { if (e.target.classList && e.target.classList.contains('blank')) ui.lastBlank = e.target.id; });
  panel.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.classList.contains('blank')) { e.preventDefault(); checkS1(); } });
  panel.addEventListener('mousedown', function (e) { if (e.target.closest('[data-a="chip"]')) e.preventDefault(); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-a');
    if (a === 'goto') { var n = +b.getAttribute('data-n'); if (canGo(n)) { S.stage = n; ui.msg = null; ui.confirmGo = false; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } return; }
    if (a === 'check') return checkS1();
    if (a === 'hint') return hintS1();
    if (a === 'chip') {
      var tgt = (ui.lastBlank && panel.querySelector('#' + ui.lastBlank)) || [].filter.call(panel.querySelectorAll('.blank'), function (i) { return !i.value; })[0] || panel.querySelector('.blank');
      if (tgt) { tgt.value = b.getAttribute('data-w'); tgt.classList.remove('wrong'); var nxt = [].filter.call(panel.querySelectorAll('.blank'), function (i) { return !i.value; })[0]; (nxt || tgt).focus(); }
      return;
    }
    if (a === 'power') { S.s1.powered = true; ui.msg = null; S.tiers = clone(DEFAULT_TIERS); save(); render(); confetti(); return; }
    if (a === 'purpose') { S.purpose = b.getAttribute('data-id'); S.s2done = false; S.finished = false; ui.confirmGo = false; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (a === 'purpose-reset') { S.purpose = null; S.s2done = false; S.finished = false; S.periph = []; save(); render(); return; }
    if (a === 'tier') {
      var k = b.getAttribute('data-k'), i = +b.getAttribute('data-i');
      S.tiers[k] = i; S.finished = false; ui.confirmGo = false; save();
      var y = window.scrollY; render(); window.scrollTo(0, y);
      flash(k === 'psu' ? 'psu' : k);
      var again = panel.querySelector('[data-a="tier"][data-k="' + k + '"][data-i="' + i + '"]'); if (again) again.focus({ preventScroll: true });
      return;
    }
    if (a === 'stay') { ui.confirmGo = false; render(); return; }
    if (a === 's2next') {
      var pu = purpose(); var unmet = pu.reqs.filter(function (r) { return !reqMet(r); }).length;
      if ((unmet || !coolOk()) && !b.getAttribute('data-force')) { ui.confirmGo = true; var yy = window.scrollY; render(); window.scrollTo(0, yy); return; }
      S.s2done = true; S.stage = 3; ui.confirmGo = false; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); confetti(); return;
    }
    if (a === 'padd') { ui.pending = b.getAttribute('data-id'); ui.pfb = null; keepScroll(); return; }
    if (a === 'pcancel') { ui.pending = null; ui.pfb = null; keepScroll(); return; }
    if (a === 'premove') { var id = b.getAttribute('data-id'); S.periph = S.periph.filter(function (c) { return c.id !== id; }); S.finished = false; save(); keepScroll(); return; }
    if (a === 'classify') {
      var d = pById(b.getAttribute('data-id')), t = b.getAttribute('data-t');
      if (t === d.t) { S.periph.push({ id: d.id }); ui.pending = null; ui.pfb = null; S.finished = false; save(); keepScroll(); flash('io'); }
      else {
        S.pwrong++; save();
        var hint = d.t === 'both' ? 'Think again: does it send something in <i>and</i> give something back out?' :
          t === 'both' ? 'It only works in one direction. Does data go into the computer, or come out of it?' :
          d.t === 'in' ? 'Not quite. Does it show or play anything, or does it send something into the computer?' : 'Not quite. Does it send anything into the computer, or does it show or play results?';
        ui.pfb = hint; keepScroll();
      }
      return;
    }
    if (a === 'finish') { S.finished = true; S.stage = 4; playPost.done = false; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); confetti(); return; }
    if (a === 'copy') {
      var txt = summaryText(), note = document.getElementById('copyNote');
      try {
        navigator.clipboard.writeText(txt).then(function () { note.textContent = 'Copied. Paste it into your notes or Teams.'; }, function () { showText(note, txt); });
      } catch (err) { showText(note, txt); }
      return;
    }
    if (a === 'another') { ui.sawReal = false; rc = {}; S.purpose = null; S.tiers = clone(DEFAULT_TIERS); S.periph = []; S.s2done = false; S.finished = false; S.stage = 2; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (a === 'restart') { ui.sawReal = false; rc = {}; S = fresh(); ui.msg = null; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  });
  function keepScroll() { var y = window.scrollY; render(); window.scrollTo(0, y); }
  function showText(note, txt) { note.innerHTML = 'Copy this text:<br><textarea id="copyBox" rows="8" style="width:100%;font-family:var(--mono);font-size:14px">' + esc(txt) + '</textarea>'; var t = document.getElementById('copyBox'); t.focus(); t.select(); }

  if (S.stage >= 4 && !S.finished) S.stage = 3;
  if (S.stage >= 2 && !S.s1.powered) S.stage = 1;
  if (S.stage === 3 && !S.purpose) S.stage = 2;
  render();
})();
</script>
